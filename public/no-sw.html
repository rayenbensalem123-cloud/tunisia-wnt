<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Clearing cache — Tunisia WNT</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b111e;
        color: #e8eefc;
        font: 600 15px/1.6 ui-sans-serif, system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        max-width: 460px;
        background: #131c31;
        border: 1px solid #22304d;
        border-radius: 14px;
        padding: 26px 28px;
      }
      h1 { font-size: 17px; margin: 0 0 10px; letter-spacing: .2px; }
      p { margin: 6px 0; color: #9fb0d0; font-weight: 500; font-size: 13px; }
      code { color: #ff5f72; font-family: ui-monospace, monospace; }
      .go {
        display: inline-block; margin-top: 16px; padding: 9px 18px;
        border-radius: 10px; background: #e3062c; color: #fff;
        font-weight: 800; text-decoration: none; text-transform: uppercase;
        font-size: 12px; letter-spacing: .6px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1 id="t">Clearing cached app version…</h1>
      <p id="d">Removing service worker and stored copies.</p>
      <a class="go" id="go" href="/">Open the app</a>
    </div>
    <script>
      // Un old service worker can keep serving a previous build, because in
      // development the chunk URLs do not change between rebuilds. Removing it
      // from outside the app is the only reliable way out: the cleanup code
      // inside the app lives in a chunk the old worker still controls.
      ;(async () => {
        const log = []
        try {
          const regs = await navigator.serviceWorker.getRegistrations()
          for (const r of regs) await r.unregister()
          log.push('worker unregistered (' + regs.length + ')')
        } catch (e) {
          log.push('worker: ' + e.message)
        }
        try {
          if (window.caches) {
            const keys = await caches.keys()
            for (const k of keys) await caches.delete(k)
            log.push('caches cleared (' + keys.length + ')')
          }
        } catch (e) {
          log.push('caches: ' + e.message)
        }
        try {
          if (window.localStorage) localStorage.removeItem('sw-bypass')
        } catch (e) {}

        document.getElementById('t').textContent = 'Cache cleared'
        document.getElementById('d').textContent = log.join(' · ') + ' — reloading with the current build.'
        // Full reload bypassing the HTTP cache. The worker is gone by now.
        setTimeout(() => location.replace('/'), 1200)
      })()
    </script>
  </body>
</html>
